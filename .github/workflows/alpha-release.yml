# Builds the app on every push to EM-Release/alpha and publishes the APKs to the
# "alpha" GitHub pre-release (tag `alpha`), replacing the previous alpha build.
#
# Signing: if these repository secrets are set, release APKs are built and signed:
#   ALPHA_KEYSTORE_BASE64   base64 of the .jks/.keystore file (`base64 -w0 my.jks`)
#   ALPHA_KEYSTORE_PASSWORD keystore password
#   ALPHA_KEY_ALIAS         key alias
#   ALPHA_KEY_PASSWORD      key password (defaults to the keystore password if empty)
# Without them, debug APKs are published instead so the alpha is still installable.
name: Alpha release

on:
  push:
    branches: [EM-Release/alpha]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ALPHA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Build debug APKs
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Sign release APKs
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_PASSWORD" ]; then KEY_PASS_VAR=KEY_PASSWORD; else KEY_PASS_VAR=KEYSTORE_PASSWORD; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alpha.keystore"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/alpha.keystore" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "env:$KEY_PASS_VAR" \
              --out "${apk%-unsigned.apk}.apk" "$apk"
          done
          rm -f "$RUNNER_TEMP/alpha.keystore"

      - name: Collect APKs
        run: |
          mkdir -p dist
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "$HAS_SIGNING" = "true" ]; then
            SRC=app/build/outputs/apk/release; TYPE=release
          else
            SRC=app/build/outputs/apk/debug; TYPE=debug
          fi
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "$SRC/app-$abi-$TYPE.apk" "dist/essential_moments_alpha-$SHORT_SHA-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "BUILD_TYPE=$TYPE" >> "$GITHUB_ENV"
          ls -l dist

      - name: Publish alpha pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the previous alpha release and move the tag to this commit.
          gh release delete alpha --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/alpha 2>/dev/null || true

          {
            echo "Automated alpha build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}."
            echo
            echo "Build type: **${BUILD_TYPE}**"
            if [ "$BUILD_TYPE" = "debug" ]; then
              echo
              echo "> Debug-signed: it can't be installed over a release-signed build of the app (uninstall first)."
            fi
            echo
            echo "Most phones need the **arm64-v8a** APK."
            echo
            echo "### Commit"
            git log -1 --format='%s%n%n%b' "$GITHUB_SHA"
          } > notes.md

          gh release create alpha dist/* \
            --target "$GITHUB_SHA" \
            --title "Alpha (${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --prerelease
